name: Supervisor de noticias

# 07:00 y 16:00 en España. Como GitHub solo entiende UTC, se programan los cuatro
# horarios UTC posibles y un guardia filtra la hora local (horario de verano/invierno).
on:
  schedule:
    - cron: '0 5,6,14,15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: supervisor-vecina-cotilla
  cancel-in-progress: false

jobs:
  supervisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comprobar hora en España
        id: hora
        run: |
          HORA=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HORA" = "07" ] || [ "$HORA" = "16" ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
            echo "Son las $HORA en España: revisando."
          else
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
            echo "Son las $HORA en España: se omite."
          fi

      - name: Comprobar que la actualización de hoy se ejecutó bien
        if: steps.hora.outputs.ejecutar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/actualizar-noticias.yml/runs?per_page=1" \
            --jq '.workflow_runs[0] | [.created_at, .conclusion] | @tsv')
          echo "Última actualización: $RUN"
          FECHA=$(echo "$RUN" | cut -f1 | cut -c1-10)
          CONCLUSION=$(echo "$RUN" | cut -f2)
          HOY=$(date -u +%Y-%m-%d)
          if [ "$FECHA" != "$HOY" ]; then
            echo "FALLO: la actualización no se ha ejecutado hoy ($HOY)"
            exit 1
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "FALLO: la última actualización terminó en $CONCLUSION"
            exit 1
          fi
          echo "OK: actualización de hoy correcta"

      - name: Revisar datos, fotos, páginas y enlaces
        if: steps.hora.outputs.ejecutar == 'true'
        run: python3 supervisar.py
